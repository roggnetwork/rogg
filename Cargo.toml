[workspace]
members = [
    "bgpgg",
    "bgpgg/loadtests",
    "conf",
    "ggsh",
    "telemetry",
]
resolver = "2"

[workspace.package]
version = "0.6.3"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4"] }
